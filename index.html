<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>AI Character Studio v3</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1018;color:#fff;font-family:system-ui,-apple-system,sans-serif}#stage{position:fixed;inset:0 0 190px;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 30%,#536782,#171c27 68%)}#photo{position:absolute;left:50%;top:50%;max-width:92vw;max-height:80vh;display:none;transform-origin:50% 58%;user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:transform,filter}#guide{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#d1dae8;font-weight:800;padding:28px}#panel{position:fixed;z-index:20;left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));background:#070a10f2;border:1px solid #30394a;border-radius:18px;padding:7px;text-align:center}.row{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:3px 0}.btn,button{border:0;border-radius:9px;padding:8px 9px;background:#f3f5f7;color:#101218;font-weight:800;font-size:12px}.primary{background:#91dcff}.slot{background:#e8ddff}input{display:none}#status{font-size:10px;color:#c8d2e0;margin:3px}.hint{font-size:9px;color:#8e9aae}</style></head><body>
<div id="stage"><div id="guide">AI Character Studio v3<br><br>キャラ画像を読み込んで<br>動かす・着せ替える・撮影する</div><img id="photo"></div>
<div id="panel">
<div class="row"><label class="btn primary" for="file">キャラ読込</label><input id="file" type="file" accept="image/*"><button class="slot" id="save1">衣装1保存</button><button class="slot" id="save2">衣装2保存</button><button class="slot" id="load1">衣装1</button><button class="slot" id="load2">衣装2</button></div>
<div class="row"><button id="minus">−</button><button id="plus">＋</button><button id="flip">反転</button><button id="reset">戻す</button><button id="shot">撮影</button></div>
<div class="row"><button id="live">Live2D+</button><button id="breath">呼吸</button><button id="look">追従</button><button id="blink">瞬き風</button><button id="float">ふわふわ</button><button id="stop">停止</button></div>
<div class="row"><button data-bg="room">室内</button><button data-bg="night">夜</button><button data-bg="studio">スタジオ</button><button data-bg="pink">ピンク</button><button id="saveSet">設定保存</button></div>
<div id="status">キャラクター画像を選択してください</div><div class="hint">衣装スロットはこの端末内に保存。撮影は現在の画面を画像化します。</div></div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),photo=$('#photo'),guide=$('#guide'),status=$('#status'),canvas=$('#canvas');
let px=0,py=0,scale=1,flip=1,mode='',drag=false,lx=0,ly=0,raf=0,loaded=false,pointerX=0,pointerY=0,currentData='',bg='room';
const bgs={room:'radial-gradient(circle at 50% 30%,#536782,#171c27 68%)',night:'radial-gradient(circle at 50% 25%,#273c70,#080b18 70%)',studio:'radial-gradient(circle at 50% 40%,#e3e7ed,#77808c 75%)',pink:'radial-gradient(circle at 50% 35%,#f5b8d7,#684663 75%)'};
function applyBG(){stage.style.background=bgs[bg]}
function render(t=0){let ax=0,ay=0,rot=0,sx=1,sy=1,bright=1;if(mode==='live'){ay=Math.sin(t/520)*6;ax=Math.sin(t/1050)*5;rot=Math.sin(t/900)*1.5;sy=1+Math.sin(t/700)*.018;sx=1-Math.sin(t/700)*.006}if(mode==='breath'){sy=1+Math.sin(t/720)*.024;sx=1-Math.sin(t/720)*.008;ay=Math.sin(t/720)*-3}if(mode==='float'){ay=Math.sin(t/450)*13;rot=Math.sin(t/1000)*.8}if(mode==='look'){ax=pointerX*12;ay=pointerY*8;rot=pointerX*2}if(mode==='blink'){bright=.82+Math.abs(Math.sin(t/1200))*.18;sy=.995+Math.abs(Math.sin(t/1200))*.005}photo.style.transform=`translate(calc(-50% + ${px+ax}px),calc(-50% + ${py+ay}px)) scale(${scale*flip*sx},${scale*sy}) rotate(${rot}deg)`;photo.style.filter=`brightness(${bright})`;if(mode)raf=requestAnimationFrame(render)}
function loadData(data){currentData=data;photo.onload=()=>{loaded=true;photo.style.display='block';guide.style.display='none';render();status.textContent='表示成功'};photo.src=data}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=v=>loadData(v.target.result);r.readAsDataURL(f)};
function begin(x,y){if(!loaded)return;drag=true;lx=x;ly=y}function move(x,y){const r=stage.getBoundingClientRect();pointerX=Math.max(-1,Math.min(1,(x-r.width/2)/(r.width/2)));pointerY=Math.max(-1,Math.min(1,(y-r.height/2)/(r.height/2)));if(mode==='look'){render(performance.now());return}if(!drag)return;px+=x-lx;py+=y-ly;lx=x;ly=y;render()}
stage.addEventListener('touchstart',e=>{let t=e.touches[0];begin(t.clientX,t.clientY);e.preventDefault()},{passive:false});stage.addEventListener('touchmove',e=>{let t=e.touches[0];move(t.clientX,t.clientY);e.preventDefault()},{passive:false});stage.addEventListener('touchend',()=>drag=false);stage.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
function setMode(m,s){if(!loaded)return status.textContent='先に画像を選んでください';cancelAnimationFrame(raf);mode=m;status.textContent=s;render(performance.now())}
live.onclick=()=>setMode('live','Live2D+');breath.onclick=()=>setMode('breath','呼吸');look.onclick=()=>setMode('look','指の位置へ追従');blink.onclick=()=>setMode('blink','瞬き風モーション');float.onclick=()=>setMode('float','ふわふわ');stop.onclick=()=>{cancelAnimationFrame(raf);mode='';render();status.textContent='停止'};
plus.onclick=()=>{scale=Math.min(3,scale+.15);render()};minus.onclick=()=>{scale=Math.max(.25,scale-.15);render()};flip.onclick=()=>{flip*=-1;render()};reset.onclick=()=>{cancelAnimationFrame(raf);px=py=0;scale=1;flip=1;mode='';render();status.textContent='初期位置'};
document.querySelectorAll('[data-bg]').forEach(x=>x.onclick=()=>{bg=x.dataset.bg;applyBG()});
function slotSave(n){if(!currentData)return status.textContent='画像がありません';try{localStorage.setItem('charSlot'+n,currentData);status.textContent='衣装'+n+'に保存'}catch(e){status.textContent='画像が大きすぎて保存できません'}}
function slotLoad(n){let d=localStorage.getItem('charSlot'+n);if(d){loadData(d);status.textContent='衣装'+n+'を読込'}else status.textContent='衣装'+n+'は未保存'}
save1.onclick=()=>slotSave(1);save2.onclick=()=>slotSave(2);load1.onclick=()=>slotLoad(1);load2.onclick=()=>slotLoad(2);
saveSet.onclick=()=>{localStorage.setItem('studioSet',JSON.stringify({px,py,scale,flip,bg}));status.textContent='位置・倍率・背景を保存'};
try{let s=JSON.parse(localStorage.getItem('studioSet'));if(s){px=s.px||0;py=s.py||0;scale=s.scale||1;flip=s.flip||1;bg=s.bg||'room';applyBG()}}catch(e){}
shot.onclick=()=>{if(!loaded)return status.textContent='画像がありません';const w=stage.clientWidth,h=stage.clientHeight;canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');let g=c.createLinearGradient(0,0,w,h);if(bg==='night'){g.addColorStop(0,'#273c70');g.addColorStop(1,'#080b18')}else if(bg==='pink'){g.addColorStop(0,'#f5b8d7');g.addColorStop(1,'#684663')}else if(bg==='studio'){g.addColorStop(0,'#e3e7ed');g.addColorStop(1,'#77808c')}else{g.addColorStop(0,'#536782');g.addColorStop(1,'#171c27')}c.fillStyle=g;c.fillRect(0,0,w,h);const iw=photo.naturalWidth,ih=photo.naturalHeight;let fit=Math.min(w*.92/iw,h*.80/ih)*scale,dw=iw*fit,dh=ih*fit;c.save();c.translate(w/2+px,h/2+py);c.scale(flip,1);c.drawImage(photo,-dw/2,-dh/2,dw,dh);c.restore();canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='character-shot.png';a.click();status.textContent='撮影画像を作成しました'},'image/png')};
applyBG();
</script></body></html>
