<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AI Character Motion</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141c;color:#fff;font-family:system-ui,-apple-system,sans-serif}#stage{position:fixed;inset:0 0 125px;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 35%,#42536e,#171c26 65%)}#photo{position:absolute;left:50%;top:50%;max-width:88vw;max-height:78vh;display:none;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}#guide{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#bdc7d7;font-weight:700}#panel{position:fixed;z-index:20;left:8px;right:8px;bottom:8px;background:#080b11ee;border-radius:18px;padding:9px;text-align:center}.row{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:10px 12px;background:#f5f6f8;color:#101218;font-weight:800;font-size:14px}.primary{background:#8bd7ff}input{display:none}#status{font-size:12px;color:#c6d0df;margin:5px}</style></head><body>
<div id="stage"><div id="guide">①「画像を選ぶ」<br>② 指でドラッグ<br>③ Live2D風を試す</div><img id="photo"></div>
<div id="panel"><div class="row"><label class="btn primary" for="file">画像を選ぶ</label><input id="file" type="file" accept="image/*"><button id="minus">−</button><button id="plus">＋</button><button id="flip">左右反転</button><button id="reset">戻す</button></div><div class="row"><button id="live">Live2D風</button><button id="float">ふわふわ</button><button id="stop">停止</button></div><div id="status">画像を選択してください</div></div>
<script>
const stage=document.querySelector('#stage'),photo=document.querySelector('#photo'),guide=document.querySelector('#guide'),status=document.querySelector('#status');let px=0,py=0,scale=1,flip=1,mode='',drag=false,lx=0,ly=0,raf=0,loaded=false;
function render(t=0){let ax=0,ay=0,rot=0,b=1;if(mode==='live'){ax=Math.sin(t/850)*9;ay=Math.sin(t/500)*6;rot=Math.sin(t/800)*1.5;b=1+Math.sin(t/650)*.015}if(mode==='float'){ay=Math.sin(t/450)*13;rot=Math.sin(t/1000)*.7}photo.style.transform=`translate(calc(-50% + ${px+ax}px),calc(-50% + ${py+ay}px)) scale(${scale*flip*b},${scale*b}) rotate(${rot}deg)`;if(mode)raf=requestAnimationFrame(render)}
document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();status.textContent='読み込み中…';r.onload=v=>{photo.onload=()=>{loaded=true;photo.style.display='block';guide.style.display='none';px=py=0;scale=1;flip=1;mode='';render();status.textContent='表示成功：指で動かせます'};photo.src=v.target.result};r.readAsDataURL(f)};
function begin(x,y){if(!loaded)return;drag=true;lx=x;ly=y}function move(x,y){if(!drag)return;px+=x-lx;py+=y-ly;lx=x;ly=y;render()}
stage.addEventListener('touchstart',e=>{let t=e.touches[0];begin(t.clientX,t.clientY);e.preventDefault()},{passive:false});stage.addEventListener('touchmove',e=>{let t=e.touches[0];move(t.clientX,t.clientY);e.preventDefault()},{passive:false});stage.addEventListener('touchend',()=>drag=false);
document.querySelector('#plus').onclick=()=>{scale=Math.min(3,scale+.15);render()};document.querySelector('#minus').onclick=()=>{scale=Math.max(.25,scale-.15);render()};document.querySelector('#flip').onclick=()=>{flip*=-1;render()};document.querySelector('#reset').onclick=()=>{cancelAnimationFrame(raf);px=py=0;scale=1;flip=1;mode='';render()};document.querySelector('#live').onclick=()=>{if(!loaded)return;cancelAnimationFrame(raf);mode='live';status.textContent='Live2D風モーション中';render(performance.now())};document.querySelector('#float').onclick=()=>{if(!loaded)return;cancelAnimationFrame(raf);mode='float';render(performance.now())};document.querySelector('#stop').onclick=()=>{cancelAnimationFrame(raf);mode='';render();status.textContent='停止'};
</script></body></html>
