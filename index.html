<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>AI Character Studio v2</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1119;color:#fff;font-family:system-ui,-apple-system,sans-serif}#stage{position:fixed;inset:0 0 154px;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 30%,#536782,#171c27 68%)}#photo{position:absolute;left:50%;top:50%;max-width:90vw;max-height:80vh;display:none;transform-origin:50% 58%;user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:transform,filter}#guide{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#c4cedc;font-weight:700;padding:30px}#panel{position:fixed;z-index:20;left:7px;right:7px;bottom:max(7px,env(safe-area-inset-bottom));background:#070a10ed;border:1px solid #30394a;border-radius:18px;padding:8px;text-align:center}.row{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:9px 10px;background:#f4f5f7;color:#101218;font-weight:800;font-size:13px}.primary{background:#91dcff}.active{background:#a7f3c2}input{display:none}#status{font-size:11px;color:#c8d2e0;margin:4px 0 1px}.hint{font-size:10px;color:#8e9aae}</style></head><body>
<div id="stage"><div id="guide">AI Character Studio v2<br><br>① 画像を選ぶ<br>② 指で移動<br>③ モーションを選ぶ</div><img id="photo"></div>
<div id="panel"><div class="row"><label class="btn primary" for="file">画像を選ぶ</label><input id="file" type="file" accept="image/*"><button id="minus">−</button><button id="plus">＋</button><button id="flip">反転</button><button id="reset">戻す</button></div>
<div class="row"><button id="live">Live2D+</button><button id="breath">呼吸</button><button id="look">視線風</button><button id="float">ふわふわ</button><button id="stop">停止</button></div>
<div class="row"><button id="bg1">室内</button><button id="bg2">夜</button><button id="bg3">スタジオ</button></div>
<div id="status">画像を選択してください</div><div class="hint">※1枚絵を変形して作る疑似Live2Dです</div></div>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),photo=$('#photo'),guide=$('#guide'),status=$('#status');
let px=0,py=0,scale=1,flip=1,mode='',drag=false,lx=0,ly=0,raf=0,loaded=false,pointerX=0,pointerY=0;
function render(t=0){let ax=0,ay=0,rot=0,sx=1,sy=1,bright=1;if(mode==='live'){ay=Math.sin(t/520)*6;ax=Math.sin(t/1050)*5;rot=Math.sin(t/900)*1.5;sy=1+Math.sin(t/700)*.018;sx=1-Math.sin(t/700)*.006;bright=1+Math.sin(t/1200)*.018}if(mode==='breath'){sy=1+Math.sin(t/720)*.022;sx=1-Math.sin(t/720)*.008;ay=Math.sin(t/720)*-3}if(mode==='float'){ay=Math.sin(t/450)*13;rot=Math.sin(t/1000)*.8}if(mode==='look'){ax=pointerX*10;ay=pointerY*7;rot=pointerX*1.8}photo.style.transform=`translate(calc(-50% + ${px+ax}px),calc(-50% + ${py+ay}px)) scale(${scale*flip*sx},${scale*sy}) rotate(${rot}deg)`;photo.style.filter=`brightness(${bright})`;if(mode)raf=requestAnimationFrame(render)}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();status.textContent='読み込み中…';r.onload=v=>{photo.onload=()=>{loaded=true;photo.style.display='block';guide.style.display='none';px=py=0;scale=1;flip=1;mode='';render();status.textContent='表示成功：指で移動できます'};photo.src=v.target.result};r.readAsDataURL(f)};
function begin(x,y){if(!loaded)return;drag=true;lx=x;ly=y}function move(x,y){const rect=stage.getBoundingClientRect();pointerX=Math.max(-1,Math.min(1,(x-rect.width/2)/(rect.width/2)));pointerY=Math.max(-1,Math.min(1,(y-rect.height/2)/(rect.height/2)));if(mode==='look'){render(performance.now());return}if(!drag)return;px+=x-lx;py+=y-ly;lx=x;ly=y;render()}
stage.addEventListener('touchstart',e=>{let t=e.touches[0];begin(t.clientX,t.clientY);e.preventDefault()},{passive:false});stage.addEventListener('touchmove',e=>{let t=e.touches[0];move(t.clientX,t.clientY);e.preventDefault()},{passive:false});stage.addEventListener('touchend',()=>drag=false);stage.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
function setMode(m,label){if(!loaded)return status.textContent='先に画像を選んでください';cancelAnimationFrame(raf);mode=m;status.textContent=label;render(performance.now())}
$('#live').onclick=()=>setMode('live','Live2D+：呼吸＋左右揺れ＋傾き');$('#breath').onclick=()=>setMode('breath','呼吸モーション');$('#float').onclick=()=>setMode('float','ふわふわモーション');$('#look').onclick=()=>setMode('look','視線風：画面上を指でなぞってください');$('#stop').onclick=()=>{cancelAnimationFrame(raf);mode='';render();status.textContent='停止'};
$('#plus').onclick=()=>{scale=Math.min(3,scale+.15);render()};$('#minus').onclick=()=>{scale=Math.max(.25,scale-.15);render()};$('#flip').onclick=()=>{flip*=-1;render()};$('#reset').onclick=()=>{cancelAnimationFrame(raf);px=py=0;scale=1;flip=1;mode='';render();status.textContent='初期位置'};
$('#bg1').onclick=()=>stage.style.background='radial-gradient(circle at 50% 30%,#536782,#171c27 68%)';$('#bg2').onclick=()=>stage.style.background='radial-gradient(circle at 50% 25%,#273c70,#080b18 70%)';$('#bg3').onclick=()=>stage.style.background='radial-gradient(circle at 50% 40%,#e3e7ed,#77808c 75%)';
</script></body></html>
