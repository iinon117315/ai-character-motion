<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Character Photo Studio V7</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090e16;color:#fff;font-family:-apple-system,sans-serif}#app{height:100%;display:flex;flex-direction:column}header{padding:11px 12px;background:#111a29;display:flex;justify-content:space-between}#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 30%,#526985,#202a3c 55%,#0d131e)}canvas{position:absolute;inset:0;width:100%;height:100%}#hint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:800;pointer-events:none}#hint small{font-size:12px;opacity:.7;margin-top:7px}#panel{background:#090e17f5;border-top:1px solid #34435a;padding:7px 7px calc(7px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto}.row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:4px 0}button,.file{border:0;border-radius:10px;padding:9px 10px;background:#f4f6f9;color:#111;font-weight:800;font-size:12px}.active{background:#86ddff!important}.accent{background:#baf1cd!important}input[type=file]{display:none}.sl{display:grid;grid-template-columns:64px 1fr 38px;gap:7px;align-items:center;font-size:11px;margin:5px 2px}.status{text-align:center;font-size:10px;color:#aab7c8}.dot{position:absolute;width:14px;height:14px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}.face{background:#79d9ff}.chest{background:#91f0ad}.hair{background:#ffb6df}.waist{background:#ffd47d}</style></head><body>
<div id="app"><header><b>Character Photo Studio V7</b><span>Anchor Motion Lab</span></header><div id="stage"><canvas id="cv"></canvas><div id="hint">画像を選択<small>顔・胸・髪・腰の位置を指定して微動を作ります</small></div><i id="d0" class="dot face"></i><i id="d1" class="dot chest"></i><i id="d2" class="dot hair"></i><i id="d3" class="dot hair"></i><i id="d4" class="dot waist"></i></div>
<div id="panel"><div class="row"><label class="file accent">画像を選ぶ<input id="file" type="file" accept="image/*"></label><button id="auto">自動5点</button><button id="setup">手動5点</button><button id="hide">点を隠す</button></div>
<div class="row"><button class="m active" data-m="life">生命感</button><button class="m" data-m="breath">呼吸</button><button class="m" data-m="hair">髪揺れ</button><button class="m" data-m="none">停止</button></div>
<div class="sl">胸の呼吸<input id="breath" type="range" min="0" max="100" value="28"><b id="bv">28</b></div><div class="sl">髪の遅れ<input id="hair" type="range" min="0" max="100" value="35"><b id="hv">35</b></div><div class="sl">頭の微動<input id="head" type="range" min="0" max="100" value="20"><b id="dv">20</b></div><div class="status" id="status">準備：画像を読み込んでください</div></div></div>
<script>
const S=document.querySelector('#stage'),C=document.querySelector('#cv'),X=C.getContext('2d'),H=document.querySelector('#hint'),ST=document.querySelector('#status'),B=document.querySelector('#breath'),HR=document.querySelector('#hair'),HD=document.querySelector('#head');let img=new Image(),loaded=0,mode='life',setting=0,setIndex=0,showDots=1;
let A=[{x:.5,y:.25},{x:.5,y:.48},{x:.32,y:.32},{x:.68,y:.32},{x:.5,y:.72}];
function resize(){C.width=S.clientWidth*devicePixelRatio;C.height=S.clientHeight*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function dots(){A.forEach((a,i)=>{let d=document.querySelector('#d'+i);d.style.left=(a.x*100)+'%';d.style.top=(a.y*100)+'%';d.style.display=showDots&&loaded?'block':'none'})}
file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{img.onload=()=>{loaded=1;H.style.display='none';dots();ST.textContent='自動5点で試すか、手動5点で位置を指定してください'};img.src=r.result};r.readAsDataURL(f)};
auto.onclick=()=>{A=[{x:.5,y:.23},{x:.5,y:.47},{x:.32,y:.31},{x:.68,y:.31},{x:.5,y:.72}];setting=0;dots();ST.textContent='自動5点を設定しました'};
setup.onclick=()=>{setting=1;setIndex=0;showDots=1;dots();ST.textContent='① 顔の中心をタップ'};
hide.onclick=()=>{showDots=!showDots;dots();hide.textContent=showDots?'点を隠す':'点を表示'};
S.addEventListener('pointerdown',e=>{if(!setting)return;let r=S.getBoundingClientRect();A[setIndex]={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};setIndex++;dots();let names=['② 胸の中心','③ 左髪','④ 右髪','⑤ 腰'];if(setIndex<5)ST.textContent=names[setIndex-1]+'をタップ';else{setting=0;ST.textContent='5点設定完了：生命感をONにしています'}});
document.querySelectorAll('.m').forEach(q=>q.onclick=()=>{mode=q.dataset.m;document.querySelectorAll('.m').forEach(a=>a.classList.toggle('active',a===q));ST.textContent='モーション：'+q.textContent});
B.oninput=()=>bv.textContent=B.value;HR.oninput=()=>hv.textContent=HR.value;HD.oninput=()=>dv.textContent=HD.value;
function patch(sx,sy,sw,sh,dx,dy,dw,dh){X.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh)}
function draw(t){requestAnimationFrame(draw);X.clearRect(0,0,S.clientWidth,S.clientHeight);if(!loaded)return;let W=S.clientWidth,Hh=S.clientHeight,fit=Math.min(W*.9/img.width,Hh*.94/img.height),iw=img.width*fit,ih=img.height*fit,ox=(W-iw)/2,oy=(Hh-ih)/2;
X.drawImage(img,ox,oy,iw,ih);if(mode==='none')return;
let sec=t/1000,bre=+B.value/100,har=+HR.value/100,hea=+HD.value/100;
// Gentle localized overlays: chest breathing and hair/head micro-motion.
let chest=A[1],cx=ox+chest.x*iw,cy=oy+chest.y*ih,cw=iw*.34,ch=ih*.23,a=Math.sin(sec*1.25)*bre;
X.save();X.globalAlpha=.72;X.translate(cx,cy);X.scale(1+a*.006,1+a*.014);patch((chest.x-.17)*img.width,(chest.y-.115)*img.height,.34*img.width,.23*img.height,-cw/2,-ch/2,cw,ch);X.restore();
if(mode==='life'||mode==='hair'){[2,3].forEach((idx,k)=>{let p=A[idx],px=ox+p.x*iw,py=oy+p.y*ih,pw=iw*.22,ph=ih*.34,phase=sec*.78+(k?1.15:0),dx=Math.sin(phase)*2.4*har;X.save();X.globalAlpha=.58;X.translate(px+dx,py);X.rotate(Math.sin(phase)*.004*har);patch((p.x-.11)*img.width,(p.y-.17)*img.height,.22*img.width,.34*img.height,-pw/2,-ph/2,pw,ph);X.restore()})}
if(mode==='life'){let p=A[0],px=ox+p.x*iw,py=oy+p.y*ih,pw=iw*.34,ph=ih*.28,phase=Math.sin(sec*.55)*hea;X.save();X.globalAlpha=.35;X.translate(px,py);X.rotate(phase*.006);patch((p.x-.17)*img.width,(p.y-.14)*img.height,.34*img.width,.28*img.height,-pw/2,-ph/2,pw,ph);X.restore()}
}requestAnimationFrame(draw);
</script></body></html>
