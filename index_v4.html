<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AI Character Studio V4</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,sans-serif;background:#0d1320;color:#fff;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}header{padding:12px;background:#111a2a;text-align:center;font-weight:800}#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 30%,#465a78,#202b40 48%,#101725)}#stage.night{background:radial-gradient(circle at 50% 25%,#283451,#070a12)}#stage.studio{background:linear-gradient(135deg,#555,#111 55%,#333)}#stage.warm{background:radial-gradient(circle at 50% 25%,#78654b,#15151c)}#ch{position:absolute;left:50%;top:50%;max-width:92%;max-height:92%;display:none;transform-origin:50% 55%;user-select:none;-webkit-user-drag:none}#hint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:800;font-size:21px}#panel{background:#0c121d;padding:9px 9px calc(9px + env(safe-area-inset-bottom));max-height:44vh;overflow:auto}.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}button,.file{border:0;border-radius:11px;padding:10px 12px;background:#f5f7fb;color:#111;font-weight:750;font-size:14px}.active{background:#82d9ff!important}input[type=file]{display:none}.sl{display:grid;grid-template-columns:52px 1fr 42px;gap:7px;align-items:center;font-size:12px;margin:6px 0}.note{text-align:center;color:#9caabd;font-size:11px}</style></head><body><div id="app"><header>AI Character Studio V4 — Natural Motion</header><div id="stage"><img id="ch"><div id="hint">画像を選んでください</div></div><div id="panel"><div class="row"><label class="file">画像を選ぶ<input id="file" type="file" accept="image/*"></label><button id="reset">戻す</button><button id="flip">反転</button></div><div class="row"><button class="m active" data-m="idle">自然</button><button class="m" data-m="breath">呼吸</button><button class="m" data-m="float">ふわふわ</button><button class="m" data-m="look">指を追う</button><button class="m" data-m="none">停止</button></div><div class="row"><button class="bg active" data-bg="">標準</button><button class="bg" data-bg="night">夜</button><button class="bg" data-bg="studio">スタジオ</button><button class="bg" data-bg="warm">暖色</button></div><div class="sl">倍率<input id="scale" type="range" min="50" max="180" value="100"><b id="sv">100%</b></div><div class="sl">呼吸<input id="breath" type="range" min="0" max="100" value="35"><b id="bv">35</b></div><div class="sl">揺れ<input id="sway" type="range" min="0" max="100" value="28"><b id="wv">28</b></div><div class="note">ドラッグで移動・自然/呼吸/ふわふわ/指追従</div></div></div><script>
const S=document.querySelector("#stage"),I=document.querySelector("#ch"),H=document.querySelector("#hint"),SC=document.querySelector("#scale"),BR=document.querySelector("#breath"),SW=document.querySelector("#sway");let x=0,y=0,z=1,f=1,m="idle",loaded=0,drag=0,lx=0,ly=0,px=.5,py=.5,t0=performance.now();
function draw(n){let t=(n-t0)/1000,b=BR.value/100,w=SW.value/100,dx=0,dy=0,r=0,sx=1,sy=1;if(m==="idle"){dy=Math.sin(t*1.8)*3*b;r=Math.sin(t*.8)*1.2*w;sx+=Math.sin(t*1.8)*.006*b;sy+=Math.sin(t*1.8)*.012*b}if(m==="breath"){dy=Math.sin(t*2)*5*b;sx+=Math.sin(t*2)*.009*b;sy+=Math.sin(t*2)*.018*b}if(m==="float"){dy=Math.sin(t*1.35)*10*w;r=Math.sin(t*.75)*2.3*w}if(m==="look"){r=(px-.5)*7*w;dx=(px-.5)*12*w;dy=(py-.5)*8*w}I.style.transform=`translate(calc(-50% + ${x+dx}px),calc(-50% + ${y+dy}px)) rotate(${r}deg) scale(${z*sx*f},${z*sy})`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.querySelector("#file").onchange=e=>{let q=e.target.files[0];if(!q)return;let r=new FileReader;r.onload=()=>{I.src=r.result;I.style.display="block";H.style.display="none";loaded=1};r.readAsDataURL(q)};
function pos(e){let a=S.getBoundingClientRect(),p=e.touches?e.touches[0]:e;px=(p.clientX-a.left)/a.width;py=(p.clientY-a.top)/a.height;return p}S.addEventListener("touchstart",e=>{if(!loaded)return;drag=1;let p=pos(e);lx=p.clientX;ly=p.clientY},{passive:true});S.addEventListener("touchmove",e=>{let p=pos(e);if(drag&&m!=="look"){x+=p.clientX-lx;y+=p.clientY-ly;lx=p.clientX;ly=p.clientY}},{passive:true});S.addEventListener("touchend",()=>drag=0);S.addEventListener("pointermove",pos);
document.querySelectorAll(".m").forEach(q=>q.onclick=()=>{m=q.dataset.m;document.querySelectorAll(".m").forEach(a=>a.classList.toggle("active",a===q))});document.querySelectorAll(".bg").forEach(q=>q.onclick=()=>{S.className=q.dataset.bg;document.querySelectorAll(".bg").forEach(a=>a.classList.toggle("active",a===q))});SC.oninput=()=>{z=SC.value/100;sv.textContent=SC.value+"%"};BR.oninput=()=>bv.textContent=BR.value;SW.oninput=()=>wv.textContent=SW.value;reset.onclick=()=>{x=y=0;z=1;SC.value=100;sv.textContent="100%"};flip.onclick=()=>f*=-1;</script></body></html>
